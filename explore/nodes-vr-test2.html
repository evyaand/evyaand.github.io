<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodes VR Test — Evgeny Andreichyk</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --ink: #222;
      --muted: #777;
      --blue: #33a8e6;
      --line: #e7e7e7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fcfcfc;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .vr-intro {
      position: fixed;
      z-index: 10;
      top: 24px;
      left: 28px;
      width: min(440px, calc(100vw - 56px));
      pointer-events: none;
    }

    .vr-eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .vr-intro h1 {
      margin: 0;
      color: #202020;
      font-size: clamp(30px, 4vw, 54px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: .98;
    }

    .vr-intro p:last-child {
      max-width: 420px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    #vr-status {
      position: fixed;
      z-index: 10;
      left: 28px;
      bottom: 24px;
      margin: 0;
      color: #888;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
    }

    body.xr-active .vr-intro,
    body.xr-active #vr-status {
      display: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="scene"></div>

  <div class="vr-intro">
    <p class="vr-eyebrow">02 / Nodes · VR prototype</p>
    <h1>things that stay</h1>
    <p>
      Desktop is only a preview. In Meta Quest, use Enter VR and point a controller
      at a node to select it.
    </p>
  </div>

  <p id="vr-status">Checking WebXR support…</p>

  <script type="module" src="./nodes-vr-test-v2.js"></script>
</body>

</html>
